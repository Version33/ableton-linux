# Release pipeline. Wine is built and verified on the builder machine
# (./build.sh + ./scripts/make-installer.sh); CI never rebuilds it.
#
#   1. ./scripts/release.sh pushes the v<VERSION> tag
#   2. the `draft` job checks tag/VERSION/BUILD-INFO consistency and creates
#      a draft release with notes from dist/BUILD-INFO-<version>.txt
#   3. ./scripts/release.sh uploads the dist/ assets — including the
#      stable-named install-ableton-latest.run — and publishes the release
#   4. the `verify` job re-downloads every published asset and checks it
name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

jobs:
  draft:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against VERSION and BUILD-INFO
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [ "$ver" = "$(cat VERSION)" ] || {
              echo "!! tag $GITHUB_REF_NAME does not match VERSION $(cat VERSION)"; exit 1; }
          [ -f "dist/BUILD-INFO-$ver.txt" ] || {
              echo "!! dist/BUILD-INFO-$ver.txt is not committed at this tag"; exit 1; }
          [ -f "dist/wine-d2d1-nspa-11.13-$ver.tar.zst.sha256" ] || {
              echo "!! the versioned runtime checksum is not committed at this tag"; exit 1; }
          bash scripts/check-release-build-info.sh "dist/BUILD-INFO-$ver.txt" \
              --version "$ver"
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release $GITHUB_REF_NAME already exists — nothing to do"
              exit 0
          fi
          {
              echo "Single-file installer for Ableton Live 11 and 12, Max for Live, and Push on Linux."
              echo
              echo "Download \`ableton-wine-setup-$ver.run\`, put it next to your Ableton Live"
              echo "installer, and run:"
              echo
              echo '```'
              echo "sh ~/Downloads/ableton-wine-setup-$ver.run install"
              echo '```'
              echo
              echo "The newest installer is always at:"
              echo "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install-ableton-latest.run"
              echo
              echo "Build provenance:"
              echo
              echo '```'
              cat "dist/BUILD-INFO-$ver.txt"
              echo '```'
          } > /tmp/notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$ver" --notes-file /tmp/notes.md

  verify:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dir "$RUNNER_TEMP/release-assets"
      - name: Verify the asset set and checksums
        run: |
          ver="${TAG#v}"
          cd "$RUNNER_TEMP/release-assets"
          expected="$RUNNER_TEMP/expected-assets"
          printf '%s\n' \
              "ableton-wine-setup-$ver.run" \
              "ableton-wine-setup-$ver.run.sha256" \
              "wine-d2d1-nspa-11.13-$ver.tar.zst" \
              "wine-d2d1-nspa-11.13-$ver.tar.zst.sha256" \
              "BUILD-INFO-$ver.txt" \
              install-ableton-latest.run \
              install-ableton-latest.run.sha256 | LC_ALL=C sort > "$expected"
          find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
              | cmp - "$expected" || { echo "!! published asset set differs from policy"; exit 1; }
          check_record() {
              record="$1" artifact="$2"
              [ "$(wc -l < "$record")" -eq 1 ] || return 1
              read -r hash name extra < "$record"
              name="${name#\*}"
              [[ "$hash" =~ ^[0-9a-f]{64}$ ]] && [ -z "$extra" ] \
                  && [ "$name" = "$artifact" ] \
                  && [ "$hash" = "$(sha256sum "$artifact" | awk '{print $1}')" ]
          }
          check_record "ableton-wine-setup-$ver.run.sha256" "ableton-wine-setup-$ver.run"
          check_record "wine-d2d1-nspa-11.13-$ver.tar.zst.sha256" \
              "wine-d2d1-nspa-11.13-$ver.tar.zst"
          check_record install-ableton-latest.run.sha256 install-ableton-latest.run
          cmp "ableton-wine-setup-$ver.run" install-ableton-latest.run
          cmp "BUILD-INFO-$ver.txt" "$GITHUB_WORKSPACE/dist/BUILD-INFO-$ver.txt"
          cmp "wine-d2d1-nspa-11.13-$ver.tar.zst.sha256" \
              "$GITHUB_WORKSPACE/dist/wine-d2d1-nspa-11.13-$ver.tar.zst.sha256"
          bash "$GITHUB_WORKSPACE/scripts/check-release-build-info.sh" "BUILD-INFO-$ver.txt" \
              --version "$ver" \
              --runtime "wine-d2d1-nspa-11.13-$ver.tar.zst" \
              --installer "ableton-wine-setup-$ver.run"
